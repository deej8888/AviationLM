[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "aerolm"
version = "0.1.0"
description = "Small models, structured operations. Open aviation request extraction."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.115.12,<1", "uvicorn>=0.34,<1", "pydantic>=2.11,<3",
  "pydantic-settings>=2.9,<3", "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.12,<1"]
ml = [
  "torch==2.9.1", "transformers==4.57.6", "trl==0.24.0",
  "peft==0.18.1", "accelerate==1.12.0", "datasets==4.3.0",
]
cuda = ["bitsandbytes==0.49.1; sys_platform == 'linux'"]
unsloth = [
  "unsloth==2026.1.4; sys_platform == 'linux'",
  "unsloth_zoo==2026.1.4; sys_platform == 'linux'",
  "xformers==0.0.33.post2; sys_platform == 'linux'",
  "torchvision==0.24.1; sys_platform == 'linux'",
  "torchao==0.14.1; sys_platform == 'linux'",
]

[project.scripts]
aerolm = "aerolm.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/aerolm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["ml: optional real PyTorch/TRL/PEFT integration smoke test"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
default-groups = []
